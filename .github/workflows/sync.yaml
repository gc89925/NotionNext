name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:
  # A change to the sync workflow itself runs one real post-merge smoke test.
  # Other pushes do not trigger this workflow.
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync.yaml'

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge upstream while preserving fork workflows
        env:
          UPSTREAM_REPO: notionnext-org/NotionNext
          UPSTREAM_BRANCH: main
          TARGET_BRANCH: main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Fork is already up to date."
            exit 0
          fi

          merge_rc=0
          git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" || merge_rc=$?

          # GitHub's built-in GITHUB_TOKEN is a GitHub App token and cannot
          # create/update workflow files. Workflow-only conflicts are expected:
          # keep the fork's reviewed versions and continue. Any conflict outside
          # .github/workflows remains a hard failure that requires manual review.
          conflict_paths=()
          while IFS= read -r path; do
            [ -n "$path" ] && conflict_paths+=("$path")
          done < <(git diff --name-only --diff-filter=U)
          non_workflow_conflicts=()
          for path in "${conflict_paths[@]}"; do
            if [[ "$path" != .github/workflows/* ]]; then
              non_workflow_conflicts+=("$path")
            fi
          done

          if (( ${#non_workflow_conflicts[@]} > 0 )); then
            printf '[Error] 上游合并存在非 workflow 冲突：%s\n' "${non_workflow_conflicts[*]}"
            git merge --abort || true
            exit 1
          fi

          if (( merge_rc != 0 && ${#conflict_paths[@]} == 0 )); then
            echo "[Error] 上游合并失败，但没有可识别的冲突文件。"
            git merge --abort || true
            exit "$merge_rc"
          fi

          # Record every upstream workflow path changed relative to the fork's
          # current HEAD, including files that conflicted during the merge.
          workflow_paths=()
          while IFS= read -r path; do
            [ -n "$path" ] && workflow_paths+=("$path")
          done < <(
            {
              git diff --name-only HEAD "upstream/${UPSTREAM_BRANCH}" -- .github/workflows
              printf '%s\n' "${conflict_paths[@]}"
            } | sed '/^$/d' | sort -u
          )

          for path in "${workflow_paths[@]}"; do
            if git cat-file -e "HEAD:${path}" 2>/dev/null; then
              git restore --source=HEAD --staged --worktree -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done

          # Always create the merge commit, even when upstream changed only
          # workflow files. Recording upstream as a parent prevents the same
          # workflow-only conflict from repeating every day.
          git commit -m "chore: sync upstream NotionNext main"
          git push origin "HEAD:${TARGET_BRANCH}"

          if (( ${#workflow_paths[@]} > 0 )); then
            {
              echo "### Upstream workflow changes require review"
              echo
              printf -- '- `%s`\n' "${workflow_paths[@]}"
              echo
              echo "Application/docs changes were synced. Workflow files were preserved from the fork because GITHUB_TOKEN cannot update them."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::上游包含 workflow 变更；应用代码已同步，workflow 文件保留 fork 版本，等待 Hermes 周维护审核。"
          fi
